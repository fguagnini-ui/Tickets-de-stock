<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickets de Stock - Redireccionando...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Redirects any deep path back to the application root keeping query and hash
      var pathSegmentsToKeep = 0;
      var l = window.location;
      // If hosted in a repository subpath, find relative root
      var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      window.location.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPath + '/?p=' + encodeURIComponent(l.pathname.slice(repoPath.length)) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash
      );
    </script>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: #171717;
        color: #f5f5f5;
        text-align: center;
        padding: 20px;
      }
      .card {
        background-color: #262626;
        border: 1px solid #404040;
        border-radius: 16px;
        padding: 32px;
        max-width: 400px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      }
      h1 { font-size: 20px; margin-bottom: 8px; }
      p { font-size: 14px; color: #a3a3a3; margin-bottom: 20px; }
      a {
        display: inline-block;
        background: #f5f5f5;
        color: #171717;
        padding: 10px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Tickets de Stock</h1>
      <p>Redirigiendo a la aplicación principal...</p>
      <a href="./">Ir al inicio</a>
    </div>
  </body>
</html>
